<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Video Summary</title>
    <script>
      try {
        var t = localStorage.getItem("vs-theme") || "night";
        if (!/^(night|nord|graphite|dawn|forest|rose)$/.test(t)) t = "night";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
